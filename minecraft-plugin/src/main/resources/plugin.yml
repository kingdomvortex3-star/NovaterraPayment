
name: NovaTerraPayment
version: '${version}'
main: id.novaterra.payment.NovaTerraPayment
api-version: '26.3'
author: Vortex Teams
description: Automated Minecraft Payment and Coin System

softdepend:
  - PlaceholderAPI
  - LuckPerms

commands:
  novapayment:
    description: Main NovaTerra Payment command
    aliases:
      - ntpayment
      - ntp
    usage: /novapayment [reload]
    permission: novaterra.payment.admin

  coin:
    description: Open NovaTerra Coin Market
    aliases:
      - coins
    usage: /coin
    permission: novaterra.payment.use

  coinadmin:
    description: Manage player Coin balances
    usage: /coinadmin <give|take|set> <player> <amount>
    permission: novaterra.payment.admin

permissions:
  novaterra.payment.admin:
    description: Access to payment administration
    default: op

  novaterra.payment.use:
    description: Access to Coin Market
    default: true

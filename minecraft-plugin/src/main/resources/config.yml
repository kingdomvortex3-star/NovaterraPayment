  starting-balance: 0
  max-transaction: 1000000000000
  max-balance: 9000000000000000

payment:
  provider: "MIDTRANS"
  currency: "IDR"
  enabled-methods:
    - "QRIS"

messages:
  prefix: "&8[&bNovaTerra&8] "
  no-permission: "&cKamu tidak memiliki izin!"
  reload: "&aKonfigurasi berhasil dimuat ulang."


developer:
  name: "Vortex Teams"
  project: "NOVATERRA PAYMENT"
  version: "1.0.0"

settings:
  debug: false
  language: "id"

database:
  type: "SQLITE"

  sqlite:
    file: "database.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "novaterra_payment"
    username: "root"
    password: ""
    ssl: false

api:
  enabled: true
  url: "https://api.novaterra.my.id"
  secret: "CHANGE_THIS_SECRET"
  server-id: "novaterra-survival"
  connection-timeout: 10000
  read-timeout: 15000

  synchronization:
    enabled: true
    interval-seconds: 5
    batch-size: 20

coin:
  currency-name: "Coin"
  starting-balance: 0
  max-transaction: 1000000000000
  max-balance: 9000000000000000

payment:
  provider: "MIDTRANS"
  currency: "IDR"
  enabled-methods:
    - "QRIS"

rank-shop:
  enabled: true

  # Command dijalankan melalui console.
  # Sesuaikan nama group dengan group LuckPerms server kamu.
  ranks:
    donatur:
      name: "DONATUR"
      price: 57500
      command: "lp user %player% parent set donatur"

    ascendance:
      name: "ASCENDANCE"
      price: 36800
      command: "lp user %player% parent set ascendance"

    sovereign:
      name: "SOVEREIGN"
      price: 28750
      command: "lp user %player% parent set sovereign"

    immortal:
      name: "IMMORTAL"
      price: 21850
      command: "lp user %player% parent set immortal"

    duke:
      name: "DUKE"
      price: 18400
      command: "lp user %player% parent set duke"

    viscount:
      name: "VISCOUNT"
      price: 9200
      command: "lp user %player% parent set viscount"

    baron:
      name: "BARON"
      price: 5750
      command: "lp user %player% parent set baron"

    knight:
      name: "KNIGHT"
      price: 4025
      command: "lp user %player% parent set knight"

    peasant:
      name: "PEASANT"
      price: 2300
      command: "lp user %player% parent set peasant"

messages:
  prefix: "&8[&bNovaTerra&8] "
  no-permission: "&cKamu tidak memiliki izin!"
  reload: "&aKonfigurasi berhasil dimuat ulang."
  player-only: "&cPerintah ini hanya untuk pemain."

developer:
  name: "Vortex Teams"
  project: "NOVATERRA PAYMENT"
  version: "1.0.0"

settings:
  debug: false
  language: id

database:
  type: SQLITE

  sqlite:
    file: database.db

  mysql:
    host: localhost
    port: 3306
    database: novaterra_payment
    username: root
    password: ""
    ssl: false

api:
  enabled: false

  # Isi setelah domain HTTPS tersedia.
  url: "https://payment.domain-kamu.com"

  # Samakan dengan secret API setelah sistem autentikasi dibuat.
  secret: "CHANGE_THIS_SECRET"

  connection-timeout: 10000
  read-timeout: 15000

  synchronization:
    enabled: false
    interval-seconds: 5
    batch-size: 20

coin:
  currency-name: "Coin"
  starting-balance: 0

payment:
  provider: "MIDTRANS"
  currency: "IDR"
  enabled-methods:
    - QRIS

messages:
  prefix: "&8[&bNovaTerra&8] "
  no-permission: "&cKamu tidak memiliki izin!"
  reload: "&aKonfigurasi berhasil dimuat ulang."
  player-only: "&cPerintah ini hanya untuk pemain."

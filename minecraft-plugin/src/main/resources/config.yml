
developer:
  name: "Vortex Teams"
  project: "NOVATERRA PAYMENT"
  version: "1.0.0"

settings:
  debug: false
  language: "id"

database:
  type: "SQLITE"

  sqlite:
    file: "database.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "novaterra_payment"
    username: "root"
    password: ""
    ssl: false

api:
  enabled: false
  url: "https://payment.domain-kamu.com"
  secret: "CHANGE_THIS_SECRET"
  server-id: "novaterra-survival"
  connection-timeout: 10000
  read-timeout: 15000

  synchronization:
    enabled: false
    interval-seconds: 5
